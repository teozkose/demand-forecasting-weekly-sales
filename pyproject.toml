[project]
name = "demand"
version = "2.0.0"
description = "Weekly demand forecasting with a rolling-origin backtest, prediction intervals and an inventory view"
requires-python = ">=3.11"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
